name: Publish LazyCat LPK

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  schedule:
    # HA 每月一个正式版 + 若干补丁版，每 6 小时探一次足够
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "auto / check / build / publish-official / publish-private"
        type: string
        required: false
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lazycat-publish-homeassistant
  cancel-in-progress: false

jobs:
  lazycat:
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: ${{ inputs.operation || 'auto' }}
      config: .github/lazycat-action.yml
      image-id: app
      toolchains: none
      versioned-release-asset: true
    secrets:
      LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
